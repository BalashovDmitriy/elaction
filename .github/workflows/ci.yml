name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  lint:
    name: Линт и формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить тулинг
        run: pip install -r requirements-dev.txt

      # Тот же набор хуков, что стоит локально — расхождения исключены.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # Набор идёт матрицей: `run_tests.py --part K/N` делит его на N машин по весам
  # тестов, а на машине часть снова раскладывается по ядрам. Упирается прогон
  # в самую долгую единицу — сид бота на настоящем здании, — и трёх машин
  # хватает, чтобы каждая шла примерно столько же, сколько он.
  engine:
    name: Проверка движком (${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    strategy:
      # Упавшая часть не снимает остальные: иначе второй провал видно только
      # со второго пуша.
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить Godot ${{ env.GODOT_VERSION }}
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Импорт ресурсов и разбор скриптов
        run: python tools/godot_check.py

      - name: Тесты GUT
        run: python tools/run_tests.py --part ${{ matrix.part }}/3
