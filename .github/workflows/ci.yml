name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  lint:
    name: Линт и формат
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Установить тулинг
        run: pip install -r requirements-dev.txt

      # The same set of hooks as installed locally — discrepancies are ruled out.
      - name: pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  # The suite runs as a matrix: `run_tests.py --part K/N` splits it across N machines by test
  # weights, and on a machine its part runs as a queue over its threads, by frames without the real
  # clock (`--fixed-fps`, docs/testing.md). The run is bounded by the longest jobs — the bot seeds
  # and the car corpses.
  engine:
    name: Проверка движком (${{ matrix.part }}/3)
    runs-on: ubuntu-latest
    strategy:
      # A failed part does not cancel the others: otherwise the second failure would be visible only
      # from the second push.
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Установить Godot ${{ env.GODOT_VERSION }}
        run: |
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o godot.zip "$url"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Импорт ресурсов и разбор скриптов
        run: python tools/godot_check.py

      - name: Тесты GUT
        run: python tools/run_tests.py --part ${{ matrix.part }}/3
