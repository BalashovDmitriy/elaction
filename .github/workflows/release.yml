name: Релиз

# The `v*` tag builds the archives and publishes a release. A manual run builds the same
# and attaches the archives to the run, but publishes nothing — this way the build can be
# checked without creating a tag and releasing anything extra.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"

jobs:
  version:
    name: Версия
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The tag and config/version must match, otherwise the archive is named with one
      # version and the game shows another in the menu corner. Fail before the build.
      - name: Тег сходится с версией проекта
        if: startsWith(github.ref, 'refs/tags/v')
        run: python tools/version.py --check "${{ github.ref_name }}"

      # Without an argument the version is taken from project.godot — so the check also exists
      # on a manual run, which is what it was set up for: release notes
      # must be ready before the tag, not composed in the web UI after it.
      - name: Заметки к релизу есть в CHANGELOG
        run: python tools/changelog.py ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

  build:
    name: Сборка ${{ matrix.preset }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: linux
          - os: windows-latest
            preset: windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Export templates live in the user folder, and it differs between OSes.
      # Compute the path once: both the cache and the install look at it afterwards.
      - name: Путь к шаблонам экспорта
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "TEMPLATES_DIR=$APPDATA/Godot/export_templates/${GODOT_VERSION}.stable" >> "$GITHUB_ENV"
          else
            echo "TEMPLATES_DIR=$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" >> "$GITHUB_ENV"
          fi

      # Templates weigh hundreds of megabytes and change only with the engine version.
      - name: Кэш шаблонов экспорта
        uses: actions/cache@v6
        with:
          path: ${{ env.TEMPLATES_DIR }}
          key: godot-templates-${{ runner.os }}-${{ env.GODOT_VERSION }}

      - name: Godot и шаблоны (Linux)
        if: runner.os == 'Linux'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          echo "GODOT_BIN=/usr/local/bin/godot" >> "$GITHUB_ENV"

          if [ ! -d "$TEMPLATES_DIR" ]; then
            curl -sSL -o templates.zip "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q templates.zip
            mkdir -p "$TEMPLATES_DIR"
            mv templates/* "$TEMPLATES_DIR/"
          fi
          godot --version

      - name: Godot и шаблоны (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "https://github.com/godotengine/godot/releases/download/$env:GODOT_VERSION-stable"
          Invoke-WebRequest -Uri "$base/Godot_v$env:GODOT_VERSION-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath godot
          # The regular build does not write to the parent console — take the console one,
          # otherwise the export output in the log will be empty.
          $exe = (Get-ChildItem godot -Recurse -Filter "*_console.exe" | Select-Object -First 1).FullName
          "GODOT_BIN=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          if (-not (Test-Path $env:TEMPLATES_DIR)) {
            # .tpz is the same zip, but Expand-Archive looks at the extension.
            Invoke-WebRequest -Uri "$base/Godot_v$env:GODOT_VERSION-stable_export_templates.tpz" -OutFile templates.zip
            Expand-Archive templates.zip -DestinationPath tpz
            New-Item -ItemType Directory -Force -Path $env:TEMPLATES_DIR | Out-Null
            Move-Item "tpz\templates\*" $env:TEMPLATES_DIR
          }
          & $exe --version

      - name: Экспорт
        # Shader Baker (ADR-0039) in Godot 4.5 could hang on export for hours
        # (godotengine/godot#112794): a limit so the release fails rather than hangs.
        timeout-minutes: 30
        run: python tools/export.py ${{ matrix.preset }}

      - name: Архив
        run: python tools/package.py ${{ matrix.preset }}

      # The unpacked archive is run, not the built file: what must be checked is what the player
      # downloads — together with the execute permission inside the zip (ADR-0013, point 6). Linux
      # only: the Windows build has no console, it does not write to the parent process, and there
      # is nowhere to read the launch marker from. The Windows archive is checked by hand — this is
      # the "run on a clean machine" from the DoD.
      - name: Прогон распакованного архива
        if: runner.os == 'Linux'
        shell: bash
        run: |
          unzip -q -o dist/elaction-*-linux.zip -d smoke
          binary="$(echo smoke/*/elaction.x86_64)"
          if [ ! -x "$binary" ]; then
            echo "В архиве $binary не помечен исполняемым — игрок его не запустит."
            exit 1
          fi
          python tools/smoke.py "$binary"

      - uses: actions/upload-artifact@v7
        with:
          name: elaction-${{ matrix.preset }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Публикация
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Заметки к релизу
        run: python tools/changelog.py "${{ github.ref_name }}" > notes.md

      - name: Релиз в GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip \
            --title "elaction ${{ github.ref_name }}" \
            --notes-file notes.md
