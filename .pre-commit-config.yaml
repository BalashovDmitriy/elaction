# Гейт качества перед каждым коммитом.
#
# Установка (один раз после клона):
#   .venv/Scripts/pre-commit install
#   .venv/Scripts/pre-commit install --hook-type pre-push
#
# Прогнать всё вручную:
#   .venv/Scripts/pre-commit run --all-files

# Часть хуков зовётся через `python -m <модуль>`, а не своим именем. Причина
# внешняя: pre-commit кладёт в окружение сгенерированные .exe-обёртки, и
# управление приложениями в Windows блокирует их как файлы без репутации —
# `[WinError 4551] Политика управления приложениями заблокировала этот файл`.
# Сам python.exe в тех же окружениях не блокируется, поэтому вызов модулем
# проходит. Проверка от этого не меняется, а запись переносима: в CI на Linux
# она работает ровно так же. Если упрётся ещё один хук — лечится тем же приёмом.
default_install_hook_types: [pre-commit, pre-push]
exclude: '^(\.godot/|addons/|build/|export/)'

repos:
  # mixed-line-ending намеренно не подключён: gdformat на Windows пишет CRLF,
  # а .gitattributes (* text=auto eol=lf) всё равно нормализует переводы строк
  # при коммите. Хук только добавлял бы лишний цикл "упало и исправило".
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.(tscn|tres|import|godot)$'
      - id: end-of-file-fixer
        entry: python -m pre_commit_hooks.end_of_file_fixer
        exclude: '\.(tscn|tres|import|godot)$'
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=5120]

  # Линтер и форматтер GDScript (gdtoolkit)
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdformat
      - id: gdlint
        entry: python -m gdtoolkit.linter

  - repo: local
    hooks:
      # Непрерывность между сессиями: код не уезжает вперёд статуса разработки.
      - id: status-updated
        name: docs/STATUS.md обновлён вместе с кодом
        entry: python tools/check_status.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Тяжёлые проверки движком — только на push, чтобы не тормозить коммиты
      - id: godot-check
        name: godot --headless --import (импорт ресурсов и парсинг скриптов)
        entry: python tools/godot_check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gut-tests
        name: тесты GUT (headless)
        entry: python tools/run_tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
