# Quality gate before every commit.
#
# Installation (once after cloning):
#   .venv/Scripts/pre-commit install
#   .venv/Scripts/pre-commit install --hook-type pre-push
#
# Run everything by hand:
#   .venv/Scripts/pre-commit run --all-files

# Some hooks are called via `python -m <module>`, not by their own name. The reason
# is external: pre-commit puts generated .exe wrappers into the environment, and
# Windows application control blocks them as files without reputation —
# `[WinError 4551] An Application Control policy has blocked this file`.
# python.exe itself in the same environments is not blocked, so calling as a module
# passes. The check does not change because of this, and the entry is portable: in CI on Linux
# it works exactly the same. If one more hook hits this — the same trick fixes it.
default_install_hook_types: [pre-commit, pre-push]
exclude: '^(\.godot/|addons/|build/|export/)'

repos:
  # mixed-line-ending is deliberately not enabled: gdformat on Windows writes CRLF,
  # and .gitattributes (* text=auto eol=lf) normalizes line endings anyway
  # on commit. The hook would only add an extra "failed and fixed" cycle.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        entry: python -m pre_commit_hooks.trailing_whitespace_fixer
        exclude: '\.(tscn|tres|import|godot)$'
      - id: end-of-file-fixer
        entry: python -m pre_commit_hooks.end_of_file_fixer
        exclude: '\.(tscn|tres|import|godot)$'
      # Via python -m, like end-of-file-fixer above: the hook's exe launcher,
      # which pip puts into the pre-commit environment, is unsigned, and the Windows
      # application control policy forbids running it (WinError 4551).
      - id: check-yaml
        entry: python -m pre_commit_hooks.check_yaml
      - id: check-merge-conflict
        entry: python -m pre_commit_hooks.check_merge_conflict
      - id: check-case-conflict
        entry: python -m pre_commit_hooks.check_case_conflict
      - id: check-added-large-files
        entry: python -m pre_commit_hooks.check_added_large_files
        args: [--maxkb=5120]

  # GDScript linter and formatter (gdtoolkit)
  - repo: https://github.com/Scony/godot-gdscript-toolkit
    rev: 4.5.0
    hooks:
      - id: gdformat
        entry: python -m gdtoolkit.formatter
      - id: gdlint
        entry: python -m gdtoolkit.linter

  - repo: local
    hooks:
      # Continuity between sessions: code does not get ahead of the development status.
      - id: status-updated
        name: docs/STATUS.md updated with the code
        entry: python tools/check_status.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Heavy engine checks — only on push, so as not to slow down commits.
      # If check.ps1 has already passed on this same tree, the repeat is skipped:
      # tools/check_stamp.py compares the working copy fingerprint.
      - id: godot-check
        name: godot --headless --import (import resources and parse scripts)
        entry: python tools/check_stamp.py --run python tools/godot_check.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gut-tests
        name: GUT tests (headless)
        entry: python tools/check_stamp.py --run python tools/run_tests.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
