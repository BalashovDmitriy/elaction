; Export presets.
;
; Normally the editor writes this file — whole, with all the platform defaults.
; Here is only what deliberately differs from the defaults: the engine first
; fills the preset with default values and only then applies the file,
; so a missing key means "same as everyone". More in docs/adr/
; 0013-release-and-versioning.md, item 8.
;
; Versions are not edited by hand: python tools/version.py --set 0.9.0

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; The player needs neither tests, nor developer tools, nor the editor's GUT.
exclude_filter="tests/*, tools/*, addons/*"
export_path="build/windows/elaction.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; Shader Baker: shaders are compiled at export for the platform driver, not
; on the player's machine at the moment of first display (ADR-0039, decision 8).
shader_baker/enabled=true
; Resources inside the executable: no .pck next to it to get lost when unpacking.
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/icon="res://icon.ico"
; They cannot be empty: on an empty version rcedit crashes and the export does not build.
application/file_version="0.9.0.0"
application/product_version="0.9.0.0"
application/product_name="elaction"
application/file_description="elaction — a remake of Elevator Action (Taito, 1983)"
application/copyright="MIT"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, addons/*"
export_path="build/linux/elaction.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

; Shader Baker: shaders are compiled at export for the platform driver, not
; on the player's machine at the moment of first display (ADR-0039, decision 8).
shader_baker/enabled=true
binary_format/embed_pck=true
binary_format/architecture="x86_64"
