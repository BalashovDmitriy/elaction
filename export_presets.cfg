; Пресеты экспорта.
;
; Обычно этот файл пишет редактор — целиком, со всеми умолчаниями платформы.
; Здесь только то, что осознанно отличается от умолчаний: движок сначала
; заполняет пресет значениями по умолчанию и лишь потом накладывает файл,
; поэтому отсутствующий ключ значит «как у всех». Подробнее — docs/adr/
; 0013-release-and-versioning.md, пункт 8.
;
; Версии не правятся руками: python tools/version.py --set 0.9.0

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
; Игроку не нужны ни тесты, ни инструменты разработчика, ни редакторский GUT.
exclude_filter="tests/*, tools/*, addons/*"
export_path="build/windows/elaction.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; Shader Baker: шейдеры собираются при экспорте под драйвер платформы, а не
; на машине игрока в момент первого показа (ADR-0039, решение 8).
shader_baker/enabled=true
; Ресурсы внутри исполняемого файла: рядом нет .pck, который теряют при распаковке.
binary_format/embed_pck=true
binary_format/architecture="x86_64"
application/icon="res://icon.ico"
; Пустыми быть не могут: на пустой версии rcedit падает и экспорт не собирается.
application/file_version="0.9.0.0"
application/product_version="0.9.0.0"
application/product_name="elaction"
application/file_description="elaction — ремейк Elevator Action (Taito, 1983)"
application/copyright="MIT"

[preset.1]

name="Linux"
platform="Linux"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tests/*, tools/*, addons/*"
export_path="build/linux/elaction.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

; Shader Baker: шейдеры собираются при экспорте под драйвер платформы, а не
; на машине игрока в момент первого показа (ADR-0039, решение 8).
shader_baker/enabled=true
binary_format/embed_pck=true
binary_format/architecture="x86_64"
